server {
    listen 80;
    listen [::]:80;
    server_name bilin3.mydetao.cn;

    root /var/www/bilin3.mydetao.cn/public;
    index index.html;

    access_log /var/log/nginx/bilin3.mydetao.cn.access.log;
    error_log /var/log/nginx/bilin3.mydetao.cn.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(php|phtml|phar)$ {
        return 404;
    }
}
